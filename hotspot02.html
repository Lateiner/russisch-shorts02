<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot-Jagd: ляпнуть</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .progress {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .instruction {
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .scene-container {
            position: relative;
            width: 100%;
            background: #f8fafc;
            border: 4px solid #e2e8f0;
            border-radius: 15px;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            cursor: crosshair;
            touch-action: none;
        }

        svg { width: 100%; height: 100%; }

        .hotspot {
            fill: transparent;
            cursor: pointer;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            min-height: 50px;
            transition: all 0.2s;
        }

        .btn-action {
            margin-top: 15px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
        }

        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .highlight-word {
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="progress" id="progress">Situation 1 von 6</div>
    <div class="instruction" id="instruction"></div>

    <div class="scene-container" id="scene-box">
        <svg viewBox="0 0 400 300" id="svg-stage"></svg>
    </div>

    <div id="feedback" class="feedback"></div>
    <button id="next-btn" class="btn-action" onclick="nextLevel()">Nächste Situation</button>
</div>

<script>
    const levels = [
        {
            instruction: "Jemand hat ein <span class='highlight-word'>секрет</span> (Geheimnis) verraten. Wo ist es passiert?",
            svg: `
                <circle cx="100" cy="200" r="40" fill="#94a3b8"/> 
                <circle cx="300" cy="200" r="40" fill="#64748b"/>
                <path d="M 120,140 Q 120,100 180,100 L 280,100 L 260,150 Z" fill="white" stroke="#334155" stroke-width="2"/>
                <text x="145" y="125" font-size="12" font-weight="bold">Wanja liebt Tanja!</text>
                <rect x="120" y="100" width="160" height="50" class="hotspot" onclick="handleHit(true)"/>
            `
        },
        {
            instruction: "In der <span class='highlight-word'>экзамен</span> (Prüfung) ist eine Antwort völlig daneben gegangen. Klicke auf den Fehler!",
            svg: `
                <rect x="50" y="220" width="300" height="10" fill="#334155"/>
                <circle cx="80" cy="150" r="25" fill="#475569"/>
                <path d="M 200,80 Q 200,40 260,40 L 350,40 L 330,90 Z" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
                <text x="220" y="65" font-size="14" font-weight="bold">2 + 2 = 5</text>
                <rect x="200" y="40" width="150" height="50" class="hotspot" onclick="handleHit(true)"/>
            `
        },
        {
            instruction: "Ein unpassendes Kommentar beim Essen. Wer hat etwas <span class='highlight-word'>ляпнул</span>?",
            svg: `
                <rect x="100" y="180" width="200" height="20" fill="#b45309"/>
                <circle cx="330" cy="150" r="30" fill="#f87171"/>
                <path d="M 180,60 L 320,60 L 320,110 L 280,110 L 260,140 Z" fill="white" stroke="#94a3b8" stroke-width="2"/>
                <text x="195" y="85" font-size="10">Das schmeckt wie Pappe.</text>
                <rect x="180" y="60" width="140" height="60" class="hotspot" onclick="handleHit(true)"/>
            `
        },
        {
            instruction: "Jemand hat <span class='highlight-word'>не подумав</span> (ohne nachzudenken) ein Detail der Überraschungsparty verraten!",
            svg: `
                <rect x="180" y="150" width="40" height="60" fill="#fbbf24"/>
                <path d="M 50,50 L 220,50 L 220,100 L 100,100 Z" fill="white" stroke="#1e293b" stroke-width="2"/>
                <text x="65" y="80" font-size="12">Die Torte kommt um 18 Uhr!</text>
                <rect x="50" y="50" width="170" height="50" class="hotspot" onclick="handleHit(true)"/>
            `
        },
        {
            instruction: "Im Aufzug herrscht Stille, bis jemand eine <span class='highlight-word'>глупость</span> (Dummheit) sagt. Klicke darauf!",
            svg: `
                <rect x="120" y="50" width="160" height="200" fill="#cbd5e1"/>
                <path d="M 140,80 L 260,80 L 260,130 L 160,130 Z" fill="white" stroke="#64748b" stroke-width="2"/>
                <text x="150" y="110" font-size="10">Warum starren Sie so?</text>
                <rect x="140" y="80" width="120" height="50" class="hotspot" onclick="handleHit(true)"/>
            `
        },
        {
            instruction: "Statt <span class='highlight-word'>молчать</span> (schweigen) hat diese Person einfach losgelegt. Wo?",
            svg: `
                <circle cx="200" cy="220" r="45" fill="#1e293b"/>
                <path d="M 100,50 L 300,50 L 300,120 L 200,120 L 180,160 Z" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
                <text x="120" y="85" font-size="14" font-weight="bold">ICH WEISS ALLES!</text>
                <rect x="100" y="50" width="200" height="70" class="hotspot" onclick="handleHit(true)"/>
            `
        }
    ];

    let currentLevel = 0;
    let active = true;

    function initLevel() {
        const lvl = levels[currentLevel];
        document.getElementById('progress').innerText = `Situation ${currentLevel + 1} von ${levels.length}`;
        document.getElementById('instruction').innerHTML = lvl.instruction;
        document.getElementById('svg-stage').innerHTML = lvl.svg;
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').style.background = "transparent";
        document.getElementById('next-btn').style.display = "none";
        active = true;
    }

    function handleHit(success) {
        if (!active) return;
        const fb = document.getElementById('feedback');
        if (success) {
            active = false;
            fb.innerText = "Korrekt! Das war ein klassisches Beispiel für 'ляпнуть'. ✅";
            fb.style.background = "#f0fdf4";
            fb.style.color = "var(--success)";
            document.getElementById('next-btn').style.display = "block";
            if (currentLevel === levels.length - 1) {
                document.getElementById('next-btn').innerText = "Spiel beenden & Neustart";
            }
        }
    }

    document.getElementById('scene-box').addEventListener('click', function(e) {
        if (!active || e.target.classList.contains('hotspot')) return;
        const fb = document.getElementById('feedback');
        fb.innerText = "Das war nicht die unpassende Stelle. Such weiter! ❌";
        fb.style.background = "#fef2f2";
        fb.style.color = "var(--error)";
        this.classList.add('shake');
        setTimeout(() => this.classList.remove('shake'), 300);
    });

    function nextLevel() {
        currentLevel++;
        if (currentLevel < levels.length) {
            initLevel();
        } else {
            location.reload();
        }
    }

    initLevel();
</script>

</body>
</html>
