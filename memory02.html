<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory: Wortpaare verschwinden</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --bg: #f1f5f9;
            --card-back: #1e293b;
            --card-front: #ffffff;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .stats {
            margin-bottom: 15px;
            font-weight: bold;
            color: #64748b;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            perspective: 1000px;
            min-height: 400px;
        }

        @media (min-width: 600px) {
            .memory-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .memory-card {
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s, opacity 0.8s, visibility 0.8s;
            cursor: pointer;
        }

        .memory-card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 0.9rem;
            font-weight: 500;
            user-select: none;
            box-sizing: border-box;
        }

        .card-back {
            background-color: var(--card-back);
            color: white;
            font-size: 1.5rem;
        }

        .card-front {
            background-color: var(--card-front);
            color: var(--card-back);
            transform: rotateY(180deg);
            border: 2px solid var(--primary);
        }

        /* Effekt für gefundene Paare */
        .matched-highlight .card-front {
            border-color: var(--success);
            background-color: #f0fdf4;
            color: #166534;
        }

        .hidden-card {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-restart {
            margin-top: 25px;
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        #win-message {
            display: none;
            color: var(--success);
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Memory: Wortpaare</h2>
    <div class="stats">Versuche: <span id="attempts">0</span></div>
    
    <div class="memory-grid" id="grid"></div>

    <div id="win-message">🎉 Toll! Alle Paare wurden aufgelöst!</div>
    <button class="btn-restart" id="restart" onclick="location.reload()">Nochmal spielen</button>
</div>

<script>
    const pairs = [
        { ru: "случайно ляпнул", de: "versehentlich herausgeplatzt" },
        { ru: "ляпнуть глупость", de: "Blödsinn verzapfen" },
        { ru: "не подумав", de: "ohne nachzudenken" },
        { ru: "рассказать секрет", de: "ein Geheimnis verraten" },
        { ru: "ляпнуть лишнее", de: "zu viel ausplaudern" },
        { ru: "глупая ситуация", de: "dumme Situation" }
    ];

    let flippedCards = [];
    let matchedPairs = 0;
    let attempts = 0;

    function initGame() {
        const grid = document.getElementById('grid');
        let cardData = [];
        pairs.forEach((p, idx) => {
            cardData.push({ text: p.ru, pairId: idx });
            cardData.push({ text: p.de, pairId: idx });
        });

        cardData.sort(() => Math.random() - 0.5);

        cardData.forEach(data => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.pairId = data.pairId;
            card.innerHTML = `
                <div class="card-face card-back">?</div>
                <div class="card-face card-front">${data.text}</div>
            `;
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });
    }

    function flipCard(card) {
        if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('hidden-card')) {
            return;
        }

        card.classList.add('flipped');
        flippedCards.push(card);

        if (flippedCards.length === 2) {
            attempts++;
            document.getElementById('attempts').innerText = attempts;
            checkMatch();
        }
    }

    function checkMatch() {
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.pairId === card2.dataset.pairId;

        if (isMatch) {
            // Paar gefunden: Kurz grün hervorheben, dann ausblenden
            card1.classList.add('matched-highlight');
            card2.classList.add('matched-highlight');
            
            setTimeout(() => {
                card1.classList.add('hidden-card');
                card2.classList.add('hidden-card');
                matchedPairs++;
                
                if (matchedPairs === pairs.length) {
                    document.getElementById('win-message').style.display = 'block';
                    document.getElementById('restart').style.display = 'inline-block';
                }
            }, 1000); // 1 Sekunde Sichtbarkeit vor dem Verschwinden
            
            flippedCards = [];
        } else {
            // Kein Match: Karten wieder umdrehen
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
            }, 1200);
        }
    }

    initGame();
</script>

</body>
</html>
