<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuancen-Check: Russische Verben</title>
    <style>
        :root {
            --formal: #1e40af;
            --informal: #ea580c;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .scale-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .thermometer-bar {
            width: 12px;
            background: linear-gradient(to bottom, var(--formal), #3b82f6, #fbbf24, var(--informal));
            border-radius: 6px;
            flex-shrink: 0;
        }

        .slots-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slot {
            height: 48px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
            min-height: 80px;
        }

        .verb-tile {
            background: white;
            border: 2px solid var(--formal);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: var(--formal);
        }

        .placed-verb {
            background: var(--formal);
            color: white;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .placed-verb.correct { background: var(--success); }
        .placed-verb.wrong { background: var(--error); }

        .controls { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-reset { background: #64748b; color: white; }
        .btn-solution { background: var(--informal); color: white; }
        .btn:hover { opacity: 0.9; }

        #feedback { margin-top: 15px; font-weight: bold; min-height: 20px; }
        
        .side-labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            text-align: right;
            width: 80px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0;">Nuancen-Check</h2>
    <p style="color: #475569; font-size: 0.9rem; margin-bottom: 20px;">Ordne die Verben nach ihrer Förmlichkeit.</p>

    <div class="scale-container">
        <div class="side-labels">
            <span>OFFIZIELL</span>
            <span>NEUTRAL</span>
            <span>IMPULSIV</span>
        </div>
        <div class="thermometer-bar"></div>
        <div class="slots-area" id="slots-container">
            </div>
    </div>

    <div class="word-pool" id="pool"></div>

    <div id="feedback"></div>
    <div class="controls">
        <button class="btn btn-solution" onclick="showSolution()">Lösung</button>
        <button class="btn btn-reset" onclick="resetGame()">Neu starten</button>
    </div>
</div>

<script>
    const correctOrder = ["заявить", "сказать", "прошептать", "болтать", "проговориться", "ляпнуть"];
    let currentPlacement = Array(6).fill(null);

    function createSlots() {
        const container = document.getElementById('slots-container');
        container.innerHTML = "";
        for (let i = 0; i < 6; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = `slot-${i}`;
            slot.onclick = () => removeVerb(i);
            container.appendChild(slot);
        }
    }

    function initPool() {
        const pool = document.getElementById('pool');
        pool.innerHTML = "";
        const shuffled = [...correctOrder].sort(() => Math.random() - 0.5);
        shuffled.forEach(verb => {
            const div = document.createElement('div');
            div.className = 'verb-tile';
            div.innerText = verb;
            div.id = 'tile-' + verb;
            div.onclick = () => placeVerb(verb);
            pool.appendChild(div);
        });
    }

    function placeVerb(verb) {
        const nextFree = currentPlacement.indexOf(null);
        if (nextFree === -1) return;
        currentPlacement[nextFree] = verb;
        document.getElementById('tile-' + verb).style.display = 'none';
        updateSlotUI(nextFree, verb);
        checkProgress();
    }

    function removeVerb(index) {
        const verb = currentPlacement[index];
        if (!verb) return;
        currentPlacement[index] = null;
        const tile = document.getElementById('tile-' + verb);
        if (tile) tile.style.display = 'block';
        const slot = document.getElementById('slot-' + index);
        slot.innerHTML = "";
        slot.style.borderStyle = "dashed";
        document.getElementById('feedback').innerText = "";
    }

    function updateSlotUI(index, verb) {
        const slot = document.getElementById('slot-' + index);
        slot.innerHTML = `<div class="placed-verb">${verb}</div>`;
        slot.style.borderStyle = "solid";
    }

    function checkProgress() {
        if (currentPlacement.includes(null)) return;
        let correctCount = 0;
        currentPlacement.forEach((verb, i) => {
            const slotDiv = document.getElementById('slot-' + i).firstChild;
            if (verb === correctOrder[i]) {
                slotDiv.classList.add('correct');
                correctCount++;
            } else {
                slotDiv.classList.add('wrong');
            }
        });
        const fb = document.getElementById('feedback');
        fb.innerText = correctCount === 6 ? "Hervorragend! ✅" : `${correctCount} von 6 richtig.`;
        fb.style.color = correctCount === 6 ? "var(--success)" : "var(--error)";
    }

    function showSolution() {
        // Zuerst alles aufräumen
        currentPlacement.forEach((_, i) => removeVerb(i));
        // Dann die richtige Lösung einsetzen
        correctOrder.forEach((verb, i) => {
            currentPlacement[i] = verb;
            updateSlotUI(i, verb);
            const tile = document.getElementById('tile-' + verb);
            if (tile) tile.style.display = 'none';
            document.getElementById('slot-' + i).firstChild.classList.add('correct');
        });
        document.getElementById('feedback').innerText = "Hier ist die richtige Reihenfolge!";
        document.getElementById('feedback').style.color = "var(--formal)";
    }

    function resetGame() {
        currentPlacement = Array(6).fill(null);
        createSlots();
        initPool();
        document.getElementById('feedback').innerText = "";
    }

    createSlots();
    initPool();
</script>

</body>
</html>
